version: "3.8"

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: autosentinel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autosentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autosentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autosentinel-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/autosentinel
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # Frontend Service (React / Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autosentinel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
